// Routelith agent protocol (architecture doc §9, §21.7 G2).
//
// Changes within routelith.agent.v1 are additive only: new fields and
// messages get new numbers, nothing is renumbered or removed, so a server
// talks to agents of its own and the previous version.
//
// The Rust code in src/pb.rs is generated from this file and checked in,
// so building Routelith needs no protoc. After changing this file run
// `cargo run -p rl-fed-gen` in crates/rl-fed/gen (see its README).
syntax = "proto3";

package routelith.agent.v1;

service Agent {
  // Trade a single-use enrollment token for a client certificate. Called
  // without a client certificate; the agent checks the server against the
  // CA fingerprint inside the token.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // The agent's one long-lived stream, with its client certificate.
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

message EnrollRequest {
  // The token's secret part (the CA fingerprint stays on the agent).
  bytes secret = 1;
  // PKCS#10 certificate signing request for the agent's own key.
  bytes csr_der = 2;
  // Agent version, for the server's log.
  string version = 3;
}

message EnrollResponse {
  // The agent's name, as given to `routelith ctl agent add`.
  string name = 1;
  // The signed client certificate.
  bytes cert_der = 2;
  // The server's CA certificate, which the agent pins from now on.
  bytes ca_der = 3;
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    ResultBatch results = 2;
    ConfigApplied applied = 3;
  }
}

// First message on every stream.
message Hello {
  string version = 1;
  // Operating system and architecture, e.g. "linux x86_64".
  string os = 2;
  // The agent's spool (§21.7 G8): random, made when the spool is created.
  // Seqs count within one spool; a new spool starts again at 1.
  uint64 spool_id = 3;
  // The highest seq the agent has an Ack for.
  uint64 acked_seq = 4;
}

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    ConfigSnapshot config = 2;
    Ack ack = 3;
  }
}

// Answer to Hello.
message Welcome {
  // The name the server knows this agent by (from its certificate).
  string name = 1;
  string server_version = 2;
  // The highest seq of this spool the server has stored (0 if none): the
  // agent resends from the one after it.
  uint64 stored_seq = 3;
}

// Everything this agent measures (§21.7 G5): sent after Welcome and
// whenever it changes. It replaces the previous snapshot whole.
message ConfigSnapshot {
  // Changes whenever any assignment changes.
  string version = 1;
  repeated Assignment assignments = 2;
}

// One series to measure.
message Assignment {
  // The server's id for the series; rounds carry it back.
  uint64 series_id = 1;
  string target = 2;
  // "v4", "v6" or "prefer-v6".
  string family = 3;
  // Host, schedule and probe settings as JSON (rl_fed::assign::Spec), so
  // probe settings can grow without protocol changes.
  bytes spec_json = 4;
}

// The agent took a snapshot.
message ConfigApplied {
  string version = 1;
  // Series the agent will not measure, with the reason.
  repeated Refusal refused = 2;
}

message Refusal {
  uint64 series_id = 1;
  string reason = 2;
}

// Rounds in seq order: new ones within 1 s of finishing, or older ones
// replayed from the spool after an outage.
message ResultBatch {
  repeated Round rounds = 1;
}

// One round, as the store keeps it (§6).
message Round {
  // Per agent, increasing by one per round.
  uint64 seq = 1;
  uint64 series_id = 2;
  // Round start, Unix milliseconds, by the agent's clock.
  int64 ts_ms = 3;
  uint32 sent = 4;
  // RTTs of the replies in microseconds, ascending.
  repeated uint32 rtts_us = 5;
  uint32 unreachable = 6;
  uint32 time_exceeded = 7;
  uint32 send_failed = 8;
  uint32 other_errors = 9;
  // Address measured: 4 or 16 bytes, empty if unknown.
  bytes resolved = 10;
  // Timing backend (rl_core::TimingBackend::code, 1 and up); 0 if unknown.
  uint32 timing = 11;
  uint32 flags = 12;
  // HTTP targets: median phase times and the certificate's expiry.
  HttpSummary http = 13;
}

message HttpSummary {
  optional uint32 connect_us = 1;
  optional uint32 tls_us = 2;
  optional uint32 ttfb_us = 3;
  optional uint32 total_us = 4;
  optional int64 cert_not_after_s = 5;
}

// Rounds up to this seq are stored and synced to disk; the agent may
// forget them.
message Ack {
  uint64 up_to_seq = 1;
}
