# Example Routelith configuration (ICMP, TCP, DNS and HTTP targets).
# Check it with: routelith ctl verify examples/routelith.toml

[server]
data_dir = "/var/lib/routelith"
# vantage = "local"   # name of this measuring point
# max_pps = 1000      # packets-per-second ceiling for all targets together

# Settings here apply to every target unless a group or target overrides them.
[defaults]
step    = "300s"   # one round per step, aligned to the wall clock; must divide a day
pings   = 20       # samples per round
# spread  = "20s"  # window the samples are spread over (default: pings x 1s)
# timeout = "2s"   # per-sample timeout
# size    = 56     # ICMP payload bytes
# family  = "v4"   # v4, v6, both (two series) or prefer-v6
# alerts  = ["down", "slow"]  # alert rules (below) that apply
# Each target measures ICMP echo unless it sets probe = "tcp" (connect time to
# its port; mode = "banner" times the server's first byte instead) or
# probe = "dns" (one query per sample to server; see the dns-quad9-query target)
# or probe = "http" (one request per sample to url; see the web target).

# Alert rules. A target uses a rule when its alerts setting (in [defaults],
# a group or the target) names it. Raised and cleared alerts are written to
# data/events/ and shown in the web UI.
[[alert]]
name      = "down"
metric    = "loss"          # median, min, max, p90 (ms), loss (%) or mos
condition = ">= 100%"
for       = "2 rounds"      # rounds in a row before it is raised

[[alert]]
name      = "slow"
metric    = "median"
condition = "> 50ms"        # comparisons joined by "and"
for       = "3 rounds"
clear     = "< 30ms for 3 rounds"   # default: the condition not met for as long

# SmokePing-style pattern: loss, then up to 3 rounds of anything, then loss
# again; raised while it matches.
[[alert]]
name    = "loss-burst"
type    = "loss"            # loss (% or count of lost samples) or rtt (median, ms)
pattern = [">0%", "*3*", ">0%"]

# Against the target's own history: the median of the last week's hourly
# medians (baseline_<p50|p90|min|max>_<1d|7d|28d>). A baseline is unknown,
# so the rule cannot raise, until a day of history exists.
[[alert]]
name      = "slower-than-usual"
metric    = "median"
condition = "> baseline_p50_7d * 2 + 5ms"
for       = "3 rounds"

# Alerts raised in a silence are logged and shown, but marked as not to be
# sent. Times are UTC. One window: start and end. Recurring: an rrule
# (FREQ=DAILY or WEEKLY, BYDAY, BYHOUR, BYMINUTE) and a duration.
[[silence]]
name     = "sunday-maintenance"
groups   = ["Internet"]          # or targets = [...]; neither: every target
# alerts = ["slow"]              # default: every rule
rrule    = "FREQ=WEEKLY;BYDAY=SU;BYHOUR=2;BYMINUTE=0"
duration = "2h"

# Events sent on as they happen. Each output has its own queue and thread,
# so one that is down never slows the others or the store. Filters (all
# optional): events (alert_raised, alert_cleared, ip_changed,
# server_started, server_stopped), targets, groups, alerts. Silenced and
# suppressed alerts are not sent unless quiet = true. Uncomment to use.
# [[output]]
# name      = "siem"
# type      = "syslog"
# address   = "siem.example.net"    # host[:port]; port 514, or 6514 for tls
# transport = "tls"                 # udp (default), tcp or tls
# format    = "rfc3164"             # default rfc5424
# facility  = "local0"              # the default
# framing   = "lf"                  # tcp/tls; default octet-counting
# ca_file   = "/etc/routelith/siem-ca.pem"  # added to the system's CAs
# cert_file = "/etc/routelith/client.pem"   # client certificate, with
# key_file  = "/etc/routelith/client.key"   # its key
# events    = ["alert_raised", "alert_cleared"]
#
# [[output]]
# name = "archive"
# type = "jsonl"
# path = "/var/log/routelith/events.jsonl"
#
# [[output]]                        # Windows only: the Application log,
# name = "eventlog"                 # source Routelith
# type = "eventlog"

[[group]]
name = "Core"
alerts = ["down", "loss-burst"]

  [[group.target]]
  name = "gateway"
  host = "192.168.1.1"

  [[group.target]]
  name = "dns-quad9"
  host = "dns.quad9.net"
  family = "both"

[[group]]
name = "Internet"
step = "60s"
pings = 10
# While the gateway has an alert raised, these targets' alerts are marked
# as suppressed (logged, not sent). A target can set its own parent.
parent = "gateway"

  [[group.target]]
  name = "cloudflare"
  host = "1.1.1.1"
  alerts = ["down", "slow", "slower-than-usual"]

  [[group.target]]
  name  = "cloudflare-https"
  host  = "1.1.1.1"
  probe = "tcp"
  port  = 443

  [[group.target]]
  name   = "dns-quad9-query"
  probe  = "dns"
  server = "9.9.9.9"
  query  = "{rand}.example.com"   # a fresh label per sample defeats caches
  expect_rcode = "NXDOMAIN"

  [[group.target]]
  name  = "web"
  probe = "http"
  url   = "https://www.example.org/"
  expect_status = "200-399"
  metric = "ttfb"   # ttfb, total, connect or tls
  # body_regex = "Example Domain"
  # ca_file    = "/etc/routelith/private-ca.pem"
