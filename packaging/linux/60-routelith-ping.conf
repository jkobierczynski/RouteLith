# Optional: let every group open unprivileged ICMP ping sockets, which the
# Routelith service (a transient DynamicUser group) needs for ICMP targets.
# systemd's default sysctl settings already do this; install this file only
# if `sysctl net.ipv4.ping_group_range` shows "1 0" on your system:
#   install -m 0644 packaging/linux/60-routelith-ping.conf /etc/sysctl.d/
#   sysctl --system
net.ipv4.ping_group_range = 0 2147483647
