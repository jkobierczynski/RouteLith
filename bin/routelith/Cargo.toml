[package]
name = "routelith"
description = "Network latency monitor with smoke graphs and hop-by-hop path tracing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
rl-alert.workspace = true
rl-core.workspace = true
rl-probe.workspace = true
rl-render.workspace = true
rl-sched.workspace = true
rl-store.workspace = true
rl-sys.workspace = true
rl-web.workspace = true
rl-out.workspace = true
rl-fed.workspace = true
# 0.20: newer releases need a newer Rust than the 1.85 MSRV.
roxmltree = "0.21"
# Asks for passwords in `ctl user` without echoing them.
rpassword = "7.3"
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

[build-dependencies]
# Builds the Event Log message table into routelith.exe (build.rs).
embed-resource = "3.0.12"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
