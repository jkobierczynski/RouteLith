version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 0.26 needs Rust 1.88, above the 1.85 MSRV.
      - dependency-name: hickory-proto
        versions: [">= 0.26"]
      # 0.14.6 and later need Rust 1.88 (agent protocol, rl-fed).
      - dependency-name: tonic
        versions: [">= 0.14.6"]
      - dependency-name: tonic-prost
        versions: [">= 0.14.6"]
      # 0.6 pulls in ctutils, whose constant-time fix (RUSTSEC-2026-0385,
      # ctutils 0.4.4) needs Rust 1.87. Stay on 0.5 until the MSRV moves.
      - dependency-name: argon2
        versions: [">= 0.6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
