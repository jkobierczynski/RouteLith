name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Allow unprivileged ICMP (ping sockets)
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # Known delay and loss injected with tc netem between two network namespaces;
  # checks the M0 accuracy criteria (architecture doc §21.2).
  lab-linux:
    name: accuracy lab (netns + netem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Load sch_netem
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
      - run: cargo build --release --locked
      - run: sudo tests/lab/netem-accuracy.sh target/release/routelith

  # `routelith trace` as an unprivileged user over a fake 5-hop path on a
  # TUN device, IPv4 and IPv6: responders, per-hop loss and RTT
  # (architecture doc §21.10, "Tracer").
  trace-lab:
    name: tracer lab (TUN fake path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p routelith
      - run: sudo tests/lab/trace-lab.sh target/release/routelith

  # 1,000 loopback targets for one 300 s step: p99 round-start lateness,
  # overruns and CPU (architecture doc §21.2, M0 schedule criterion).
  schedule-bench:
    name: scheduler bench (1,000 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Allow unprivileged ICMP (ping sockets)
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo build --release --locked
      - run: tests/lab/schedule-bench.sh target/release/routelith

  # 20 simulated agents x 1,000 targets streaming to one server, and one
  # real agent with 500 ICMP targets: the server keeps up, the agent stays
  # under 20 MB and 1 % of a core (architecture doc §21.8, M3 scale).
  agent-scale:
    name: agent scale test (20 x 1,000 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Allow unprivileged ICMP (ping sockets)
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo build --release --locked -p routelith
      - run: cargo build --release --locked -p rl-fed --example sim_agents
      - run: tests/lab/agent-scale.sh target/release/routelith target/release/examples/sim_agents

  # Risk R1: timing error of the Windows ICMP API against a raw-socket
  # reference on loopback (runners are Administrator). Results go to the job
  # summary. Exit 1 (target missed) is reported, not failed, until the R1
  # threshold is confirmed; any other non-zero exit fails.
  calibrate-windows:
    name: R1 calibration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Calibrate on loopback
        shell: bash
        run: |
          set +e
          target/release/routelith ctl calibrate --target 127.0.0.1 -c 2000 -i 5ms | tee calibration.txt
          statuses=("${PIPESTATUS[@]}")
          set -e
          status=${statuses[0]}
          [ "${statuses[1]}" -eq 0 ] || { echo "::error::could not save the report"; exit 1; }
          { echo '### R1 calibration (${{ matrix.os }})'; echo '```'; cat calibration.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) ;;
            1) echo "::warning::R1 target missed on ${{ matrix.os }}" ;;
            *) echo "::error::calibration could not measure (exit $status)"; exit 1 ;;
          esac

  # The packaged services start and stop cleanly (architecture doc §21.4):
  # the systemd unit as a dynamic user, and the MSI's Windows Service.
  systemd:
    name: systemd unit (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p routelith
      - name: Install the unit
        run: |
          sudo install -m 0755 target/release/routelith /usr/bin/routelith
          sudo install -m 0644 packaging/linux/routelith.service /etc/systemd/system/
          sudo install -m 0644 packaging/linux/routelith-agent.service /etc/systemd/system/
          sudo install -m 0644 packaging/linux/60-routelith-ping.conf /etc/sysctl.d/
          sudo sysctl --system > /dev/null
          sudo install -d /etc/routelith
          sudo tee /etc/routelith/routelith.toml > /dev/null <<'TOML'
          [server]
          data_dir = "/var/lib/routelith"
          vantage = "ci"
          listen_agents = "127.0.0.1:4443"
          [defaults]
          step = "60s"
          pings = 5
          [[group]]
          name = "ci"
            [[group.target]]
            name = "loopback"
            host = "127.0.0.1"
            [[group.target]]
            name = "ui"
            host = "127.0.0.1"
            probe = "tcp"
            port = 8080
          # Measured by the server and by the agent service too.
          [[group]]
          name = "remote"
          vantages = ["ci", "ci-agent"]
          step = "10s"
            [[group.target]]
            name = "loopback-remote"
            host = "127.0.0.1"
          TOML
          sudo tee /etc/routelith/agent.toml > /dev/null <<'TOML'
          server = "127.0.0.1:4443"
          data_dir = "/var/lib/routelith-agent"
          TOML
          systemd-analyze verify /etc/systemd/system/routelith.service
          systemd-analyze verify /etc/systemd/system/routelith-agent.service
          sudo systemctl daemon-reload
      - name: Start, measure, stop
        run: |
          sudo systemctl start routelith
          pid=$(systemctl show -p MainPID --value routelith)
          user=$(ps -o user= -p "$pid")
          echo "running as $user (pid $pid)"
          [ "$(id -u "$user")" -ge 61184 ] || { echo "::error::not a dynamic user"; exit 1; }
          # Both series report a round within two steps.
          for i in $(seq 150); do
            n=$(curl -fsS http://127.0.0.1:8080/api/v1/latest | jq '[.latest[] | select(.recv > 0)] | length') || n=0
            [ "$n" -ge 2 ] && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/latest | jq .
          [ "$n" -ge 2 ] || { echo "::error::no rounds from both targets"; exit 1; }
          sudo ls -l /var/lib/private/routelith
      - name: Enroll and start the agent service
        run: |
          # As the server's and the agent's own dynamic users, as the units
          # describe, so each service can read what the command writes.
          token=$(sudo systemd-run --pipe --wait --quiet -p DynamicUser=yes -p User=routelith \
            -p StateDirectory=routelith \
            /usr/bin/routelith ctl agent add ci-agent -c /etc/routelith/routelith.toml | grep -o 'rlt1-[^ ]*')
          sudo systemd-run --pipe --wait --quiet -p DynamicUser=yes -p User=routelith-agent \
            -p StateDirectory=routelith-agent \
            /usr/bin/routelith agent enroll -c /etc/routelith/agent.toml --token "$token"
          sudo systemctl start routelith-agent
          pid=$(systemctl show -p MainPID --value routelith-agent)
          user=$(ps -o user= -p "$pid")
          echo "agent running as $user (pid $pid)"
          [ "$(id -u "$user")" -ge 61184 ] || { echo "::error::the agent is not a dynamic user"; exit 1; }
          # The agent connects and its series gets a round with replies.
          for i in $(seq 90); do
            ids=$(curl -fsS http://127.0.0.1:8080/api/v1/series | jq '[.series[] | select(.vantage == "ci-agent") | .id]') || ids='[]'
            n=$(curl -fsS http://127.0.0.1:8080/api/v1/latest | jq --argjson ids "$ids" '[.latest[] | select(.recv > 0 and (.series as $s | $ids | index($s)))] | length') || n=0
            [ "$n" -ge 1 ] && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/agents | jq .
          [ "$n" -ge 1 ] || { echo "::error::no rounds from the agent service"; exit 1; }
          sudo ls -lR /var/lib/private/routelith-agent | head -20
          sudo systemctl stop routelith-agent
          result=$(systemctl show -p Result --value routelith-agent)
          status=$(systemctl show -p ExecMainStatus --value routelith-agent)
          [ "$result" = success ] && [ "$status" = 0 ] || { echo "::error::the agent stopped with $result, exit $status"; exit 1; }
      - name: Stop the server
        run: |
          sudo systemctl stop routelith
          result=$(systemctl show -p Result --value routelith)
          status=$(systemctl show -p ExecMainStatus --value routelith)
          [ "$result" = success ] && [ "$status" = 0 ] || { echo "::error::stopped with $result, exit $status"; exit 1; }
      - name: Journal
        if: always()
        run: sudo journalctl -u routelith -u routelith-agent --no-pager

  msi:
    name: MSI and Windows Service (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build the MSI
        run: cargo wix -p routelith --nocapture --output target\wix\routelith.msi
      - name: Install, check the service, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Msi($verb, $log) {
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList $verb, 'target\wix\routelith.msi', '/qn', '/l*v', $log
            if ($p.ExitCode -ne 0) {
              # The failing action and Windows Installer's error messages.
              Select-String -Path $log -Pattern 'Return value 3', '^Error \d+', 'Error \d{4}\.' -Context 15, 2 | Out-String -Width 300
              if (Test-Path C:\ProgramData\Routelith\routelith.log) { Get-Content C:\ProgramData\Routelith\routelith.log }
              throw "msiexec $verb exited with $($p.ExitCode)"
            }
          }
          $since = Get-Date
          Msi '/i' 'install.log'
          $svc = Get-CimInstance Win32_Service -Filter "Name='Routelith'"
          "state $($svc.State), account $($svc.StartName), command $($svc.PathName)"
          if ($svc.State -ne 'Running') { throw 'the service is not running' }
          if ($svc.StartName -ne 'NT AUTHORITY\LocalService') { throw 'wrong service account' }
          sc.exe qfailure Routelith
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:8080/healthz | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          Get-Content C:\ProgramData\Routelith\routelith.log
          if (-not $ok) { throw 'the web UI did not answer' }
          if (-not (Test-Path C:\ProgramData\Routelith\data)) { throw 'no data directory' }
          # The MSI's config has an eventlog output: server_started (ID 3000)
          # must show as text, through the message table in routelith.exe.
          $ev = $null
          foreach ($i in 1..10) {
            $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Routelith'; Id=3000; StartTime=$since} -MaxEvents 1 -ErrorAction SilentlyContinue
            if ($ev) { break } else { Start-Sleep 1 }
          }
          if (-not $ev) { throw 'no server_started event in the Application log' }
          "event $($ev.Id), $($ev.LevelDisplayName): $($ev.Message)"
          if ($ev.Message -notlike 'server started*') { throw 'the event does not show its message' }
          # The text is shown as written: a scoped IPv6 address's %12 is not
          # read as another insertion, and non-ASCII text survives.
          # (Write-EventLog exists only in Windows PowerShell 5.1.)
          $text = "gw (v6): address changed to fe80::1%12 $([char]0x00E9)t$([char]0x00E9)"
          powershell.exe -NoProfile -Command "Write-EventLog -LogName Application -Source Routelith -EventId 1002 -EntryType Information -Message '$text'"
          if ($LASTEXITCODE -ne 0) { throw 'Write-EventLog failed' }
          $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Routelith'; Id=1002; StartTime=$since} -MaxEvents 1
          "event $($ev.Id): $($ev.Message)"
          if ($ev.Message.Trim() -ne $text) { throw "the event text was changed: $($ev.Message)" }
          Msi '/x' 'uninstall.log'
          if (Test-Path HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\Routelith) { throw 'the event source is still registered' }
          if (Get-Service Routelith -ErrorAction SilentlyContinue) { throw 'the service is still installed' }
          if (-not (Test-Path C:\ProgramData\Routelith\routelith.toml)) { throw 'the configuration was removed' }
      - name: routelith service install / uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$PWD\target\release\routelith.exe"
          New-Item -ItemType Directory -Force C:\rl | Out-Null
          Set-Content C:\rl\routelith.toml "[server]`ndata_dir = 'C:\rl\data'`n[[output]]`nname = 'ev'`ntype = 'eventlog'`n[[group]]`nname = 'ci'`n  [[group.target]]`n  name = 'loopback'`n  host = '127.0.0.1'`n"
          $since = Get-Date
          & $exe service install --config C:\rl\routelith.toml
          if ($LASTEXITCODE -ne 0) { throw "install exited with $LASTEXITCODE" }
          Start-Sleep 3
          if ((Get-Service Routelith).Status -ne 'Running') { Get-Content C:\rl\routelith.log; throw 'not running' }
          $ev = $null
          foreach ($i in 1..10) {
            $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Routelith'; Id=3000; StartTime=$since} -MaxEvents 1 -ErrorAction SilentlyContinue
            if ($ev) { break } else { Start-Sleep 1 }
          }
          if (-not $ev) { Get-Content C:\rl\routelith.log; throw 'no server_started event in the Application log' }
          "event $($ev.Id), $($ev.LevelDisplayName): $($ev.Message)"
          if ($ev.Message -notlike 'server started*') { throw 'the event does not show its message' }
          & $exe service uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited with $LASTEXITCODE" }
          Get-Content C:\rl\routelith.log
          if (Get-Service Routelith -ErrorAction SilentlyContinue) { throw 'the service is still installed' }
          if (Test-Path HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\Routelith) { throw 'the event source is still registered' }
      - name: routelith service install --agent / uninstall --agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$PWD\target\release\routelith.exe"
          New-Item -ItemType Directory -Force C:\rls, C:\rla | Out-Null
          Set-Content C:\rls\routelith.toml "[server]`ndata_dir = 'C:\rls\data'`nvantage = 'ci'`nlisten_ui = '127.0.0.1:8090'`nlisten_agents = '127.0.0.1:4443'`n[[group]]`nname = 'remote'`nvantages = ['ci', 'win-agent']`nstep = '10s'`npings = 5`n  [[group.target]]`n  name = 'loopback'`n  host = '127.0.0.1'`n"
          Set-Content C:\rla\agent.toml "server = '127.0.0.1:4443'`ndata_dir = 'C:\rla\data'`n"
          & $exe ctl verify --no-resolve C:\rls\routelith.toml
          if ($LASTEXITCODE -ne 0) { throw 'the test configuration is invalid' }
          $token = (& $exe ctl agent add win-agent -c C:\rls\routelith.toml | Select-String -Pattern 'rlt1-\S+').Matches[0].Value
          $server = Start-Process $exe -ArgumentList 'server', '-c', 'C:\rls\routelith.toml' -PassThru -NoNewWindow -RedirectStandardError C:\rls\server.log
          foreach ($i in 1..60) { try { Invoke-RestMethod http://127.0.0.1:8090/healthz | Out-Null; break } catch { Start-Sleep 1 } }
          # Installing before enrolling is refused, with what to do.
          & $exe service install --agent --config C:\rla\agent.toml
          if ($LASTEXITCODE -eq 0) { throw 'an agent that is not enrolled was installed' }
          & $exe agent enroll -c C:\rla\agent.toml --token $token
          if ($LASTEXITCODE -ne 0) { throw "enroll exited with $LASTEXITCODE" }
          & $exe service install --agent --config C:\rla\agent.toml
          if ($LASTEXITCODE -ne 0) { throw "install exited with $LASTEXITCODE" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='RoutelithAgent'"
          "state $($svc.State), account $($svc.StartName), command $($svc.PathName)"
          if ($svc.StartName -ne 'NT AUTHORITY\LocalService') { throw 'wrong service account' }
          # The agent's series gets a round with replies.
          $ok = $false
          foreach ($i in 1..90) {
            $ids = @((Invoke-RestMethod http://127.0.0.1:8090/api/v1/series).series | Where-Object vantage -eq 'win-agent' | ForEach-Object id)
            $got = @((Invoke-RestMethod http://127.0.0.1:8090/api/v1/latest).latest | Where-Object { $ids -contains $_.series -and $_.recv -gt 0 })
            if ($got.Count -ge 1) { $ok = $true; break }
            Start-Sleep 1
          }
          Get-Content C:\rla\routelith-agent.log
          if (-not $ok) { Get-Content C:\rls\server.log; throw 'no rounds from the agent service' }
          & $exe service uninstall --agent
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited with $LASTEXITCODE" }
          if (Get-Service RoutelithAgent -ErrorAction SilentlyContinue) { throw 'the agent service is still installed' }
          if (-not (Select-String -Path C:\rla\routelith-agent.log -Pattern 'routelith agent: stopping' -Quiet)) { throw 'the agent did not stop cleanly' }
          Stop-Process -Id $server.Id
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routelith-msi
          path: |
            target/wix/routelith.msi
            *.log

  # macOS is best effort (architecture doc D4): compile only.
  # The web UI in Chromium against a running server: the overview matrix
  # fills in and the canvas draws a smoke graph (architecture doc §21.4).
  ui-browser:
    name: web UI (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --locked -p routelith
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui/smoke-graph.mjs target/debug/routelith
      - run: node tests/ui/login.mjs target/debug/routelith
      - run: node tests/ui/agents.mjs target/debug/routelith

  check-macos:
    name: check (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  musl:
    name: static build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain goes in `with:`, not the action ref, so Dependabot does
      # not "upgrade" the MSRV (it opened a bump from @1.85 to @1.120).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.85 check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
