[workspace]
resolver = "3"
members = ["bin/routelith", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkobierczynski/routelith"
publish = false

[workspace.dependencies]
rl-core = { path = "crates/rl-core" }
rl-sys = { path = "crates/rl-sys" }
rl-probe = { path = "crates/rl-probe" }
rl-sched = { path = "crates/rl-sched" }
rl-store = { path = "crates/rl-store" }
rl-render = { path = "crates/rl-render" }
crc32c = "0.6"
# 0.26 needs Rust 1.88, above the 1.85 MSRV.
hickory-proto = { version = "0.25.2", default-features = false, features = ["std"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1.6", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.10", default-features = false, features = ["tokio"] }
libc = "0.2"
proptest = "1.11"
rcgen = "0.14"
redb = "2.6"
regex = "1.11"
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.10", features = ["std"] }
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
toml = "1.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
zstd = "0.14"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

# Shared lints. `unsafe_code` is not set here because `rl-sys` needs unsafe;
# every other crate forbids it with `#![forbid(unsafe_code)]` in its lib.rs/main.rs.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
