[workspace]
resolver = "3"
members = ["bin/routelith", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/jkobierczynski/routelith"
publish = false

[workspace.dependencies]
rl-core = { path = "crates/rl-core" }
rl-sys = { path = "crates/rl-sys" }
rl-probe = { path = "crates/rl-probe" }
rl-sched = { path = "crates/rl-sched" }
rl-store = { path = "crates/rl-store" }
rl-render = { path = "crates/rl-render" }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_IO"] }

# Shared lints. `unsafe_code` is not set here because `rl-sys` needs unsafe;
# every other crate forbids it with `#![forbid(unsafe_code)]` in its lib.rs/main.rs.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
